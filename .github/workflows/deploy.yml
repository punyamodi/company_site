name: Build & Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            main-hub/package-lock.json
            InferGate-site/package-lock.json
            Converse-site/package-lock.json
            HaloDesk-site/package-lock.json
            genie-site/package-lock.json
            forge-site/package-lock.json

      # ── Install all dependencies ──────────────────────────────
      - name: Install Main Hub deps
        working-directory: main-hub
        run: npm install --legacy-peer-deps

      - name: Install InferGate deps
        working-directory: InferGate-site
        run: npm ci

      - name: Install Converse deps
        working-directory: Converse-site
        run: npm ci

      - name: Install HaloDesk deps
        working-directory: HaloDesk-site
        run: npm ci

      - name: Install Genie deps
        working-directory: genie-site
        run: npm ci

      - name: Install Forge deps
        working-directory: forge-site
        run: npm ci

      # ── Build Main Hub ────────────────────────────────────────
      - name: Build Main Hub
        working-directory: main-hub
        env:
          NEXT_PUBLIC_BASE_PATH: /Company-Site
          NEXT_PUBLIC_PLATFORM_URL: https://AppForge-AI.github.io/Company-Site/
        run: npm run build

      # ── Build InferGate ───────────────────────────────────────
      - name: Build InferGate
        working-directory: InferGate-site
        env:
          NEXT_PUBLIC_BASE_PATH: /Company-Site/infergate
          NEXT_PUBLIC_PLATFORM_URL: https://AppForge-AI.github.io/Company-Site/
        run: npm run build

      # ── Build Converse ────────────────────────────────────────
      - name: Build Converse
        working-directory: Converse-site
        env:
          NEXT_PUBLIC_BASE_PATH: /Company-Site/converse
          NEXT_PUBLIC_PLATFORM_URL: https://AppForge-AI.github.io/Company-Site/
        run: npm run build

      # ── Build HaloDesk ────────────────────────────────────────
      - name: Build HaloDesk
        working-directory: HaloDesk-site
        env:
          NEXT_PUBLIC_BASE_PATH: /Company-Site/halodesk
          NEXT_PUBLIC_PLATFORM_URL: https://AppForge-AI.github.io/Company-Site/
        run: npm run build

      # ── Build Genie ───────────────────────────────────────────
      - name: Build Genie
        working-directory: genie-site
        env:
          NEXT_PUBLIC_BASE_PATH: /Company-Site/genie
          NEXT_PUBLIC_PLATFORM_URL: https://AppForge-AI.github.io/Company-Site/
        run: npm run build

      # ── Build Forge ───────────────────────────────────────────
      - name: Build Forge
        working-directory: forge-site
        env:
          NEXT_PUBLIC_BASE_PATH: /Company-Site/forge
          NEXT_PUBLIC_PLATFORM_URL: https://AppForge-AI.github.io/Company-Site/
        run: npm run build

      # ── Assemble dist ─────────────────────────────────────────
      - name: Assemble dist directory
        run: |
          mkdir -p dist
          # Main Hub at root
          cp -r main-hub/out/. dist/
          # Product subsites
          mkdir -p dist/infergate dist/converse dist/halodesk dist/genie dist/forge
          cp -r InferGate-site/out/. dist/infergate/
          cp -r Converse-site/out/. dist/converse/
          cp -r HaloDesk-site/out/. dist/halodesk/
          cp -r genie-site/out/. dist/genie/
          cp -r forge-site/out/. dist/forge/
          # GitHub Pages requires a .nojekyll file to serve _ prefixed dirs
          touch dist/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
