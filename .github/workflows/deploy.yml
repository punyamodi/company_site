name: Build & Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            company-site/main-hub/package-lock.json
            company-site/InferGate-site/package-lock.json
            company-site/Converse-site/package-lock.json
            company-site/HaloDesk-site/package-lock.json
            company-site/onyx-site/package-lock.json

      # ── Install all dependencies ──────────────────────────────
      - name: Install Main Hub deps
        working-directory: company-site/main-hub
        run: npm ci

      - name: Install InferGate deps
        working-directory: company-site/InferGate-site
        run: npm ci

      - name: Install Converse deps
        working-directory: company-site/Converse-site
        run: npm ci

      - name: Install HaloDesk deps
        working-directory: company-site/HaloDesk-site
        run: npm ci

      - name: Install Onyx deps
        working-directory: company-site/onyx-site
        run: npm ci

      # ── Build Main Hub ────────────────────────────────────────
      - name: Build Main Hub
        working-directory: company-site/main-hub
        env:
          NEXT_PUBLIC_BASE_PATH: /company_site
          NEXT_PUBLIC_PLATFORM_URL: https://punyamodi.github.io/company_site/
        run: npm run build

      # ── Build InferGate ───────────────────────────────────────
      - name: Build InferGate
        working-directory: company-site/InferGate-site
        env:
          NEXT_PUBLIC_BASE_PATH: /company_site/infergate
          NEXT_PUBLIC_PLATFORM_URL: https://punyamodi.github.io/company_site/
        run: npm run build

      # ── Build Converse ────────────────────────────────────────
      - name: Build Converse
        working-directory: company-site/Converse-site
        env:
          NEXT_PUBLIC_BASE_PATH: /company_site/converse
          NEXT_PUBLIC_PLATFORM_URL: https://punyamodi.github.io/company_site/
        run: npm run build

      # ── Build HaloDesk ────────────────────────────────────────
      - name: Build HaloDesk
        working-directory: company-site/HaloDesk-site
        env:
          NEXT_PUBLIC_BASE_PATH: /company_site/halodesk
          NEXT_PUBLIC_PLATFORM_URL: https://punyamodi.github.io/company_site/
        run: npm run build

      # ── Build Onyx ────────────────────────────────────────────
      - name: Build Onyx
        working-directory: company-site/onyx-site
        env:
          NEXT_PUBLIC_BASE_PATH: /company_site/onyx
          NEXT_PUBLIC_PLATFORM_URL: https://punyamodi.github.io/company_site/
        run: npm run build

      # ── Assemble dist ─────────────────────────────────────────
      - name: Assemble dist directory
        run: |
          mkdir -p dist
          # Main Hub at root
          cp -r company-site/main-hub/out/. dist/
          # Product subsites
          mkdir -p dist/infergate dist/converse dist/halodesk dist/onyx
          cp -r company-site/InferGate-site/out/. dist/infergate/
          cp -r company-site/Converse-site/out/. dist/converse/
          cp -r company-site/HaloDesk-site/out/. dist/halodesk/
          cp -r company-site/onyx-site/out/. dist/onyx/
          # GitHub Pages requires a .nojekyll file to serve _ prefixed dirs
          touch dist/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
